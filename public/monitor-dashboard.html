<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Personal - Production Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .status-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .status-label {
            opacity: 0.7;
            font-size: 0.9rem;
        }

        .status-online { color: #10b981; }
        .status-warning { color: #f59e0b; }
        .status-error { color: #ef4444; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
        }

        .panel h3 {
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .endpoint-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .endpoint-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border-left: 4px solid transparent;
        }

        .endpoint-item.online {
            border-left-color: #10b981;
        }

        .endpoint-item.error {
            border-left-color: #ef4444;
        }

        .endpoint-name {
            font-weight: 500;
        }

        .endpoint-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
        }

        .status-dot.error {
            background: #ef4444;
        }

        .log-container {
            grid-column: 1 / -1;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-entry {
            padding: 8px 12px;
            margin: 2px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.02);
        }

        .log-info { border-left: 3px solid #3b82f6; }
        .log-success { border-left: 3px solid #10b981; }
        .log-warning { border-left: 3px solid #f59e0b; }
        .log-error { border-left: 3px solid #ef4444; }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        .btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .switch {
            position: relative;
            width: 40px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #374151;
            transition: 0.4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #10b981;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Production Monitor</h1>
            <p>SpendWise Personal - Real-time System Health</p>
        </div>

        <div class="status-overview">
            <div class="status-card">
                <div class="status-value status-online" id="overall-status">100%</div>
                <div class="status-label">System Health</div>
            </div>
            <div class="status-card">
                <div class="status-value" id="response-time">--</div>
                <div class="status-label">Avg Response Time</div>
            </div>
            <div class="status-card">
                <div class="status-value" id="uptime-status">--</div>
                <div class="status-label">Uptime</div>
            </div>
            <div class="status-card">
                <div class="status-value" id="last-check">--</div>
                <div class="status-label">Last Check</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" onclick="runHealthCheck()" id="check-btn">🔄 Run Check</button>
            <div class="auto-refresh">
                <label class="switch">
                    <input type="checkbox" id="auto-refresh-toggle" onchange="toggleAutoRefresh()">
                    <span class="slider"></span>
                </label>
                <span>Auto Refresh (30s)</span>
            </div>
        </div>

        <div class="grid">
            <div class="panel">
                <h3>📊 Endpoint Status</h3>
                <div class="endpoint-list" id="endpoint-list">
                    <!-- Endpoints will be populated here -->
                </div>
            </div>

            <div class="panel">
                <h3>🔐 Authentication Status</h3>
                <div class="endpoint-list" id="auth-status">
                    <!-- Auth status will be populated here -->
                </div>
            </div>

            <div class="panel log-container">
                <h3>📋 Real-time Logs</h3>
                <div id="log-output"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let autoRefreshInterval = null;
        let logs = [];

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = {
                timestamp,
                message,
                type
            };
            
            logs.unshift(entry);
            if (logs.length > 50) logs = logs.slice(0, 50);
            
            updateLogDisplay();
        }

        function updateLogDisplay() {
            const logOutput = document.getElementById('log-output');
            logOutput.innerHTML = logs.map(entry => 
                `<div class="log-entry log-${entry.type}">
                    [${entry.timestamp}] ${entry.message}
                </div>`
            ).join('');
        }

        async function testEndpoint(name, url, options = {}) {
            const startTime = Date.now();
            
            try {
                const response = await fetch(url, options);
                const duration = Date.now() - startTime;
                const success = response.ok;
                
                log(`${success ? '✅' : '❌'} ${name}: ${response.status} (${duration}ms)`, success ? 'success' : 'error');
                
                return {
                    name,
                    url: url.replace(API_BASE, ''),
                    status: response.status,
                    success,
                    duration
                };
            } catch (err) {
                const duration = Date.now() - startTime;
                log(`❌ ${name}: ${err.message}`, 'error');
                
                return {
                    name,
                    url: url.replace(API_BASE, ''),
                    status: 'ERROR',
                    success: false,
                    duration,
                    error: err.message
                };
            }
        }

        async function runHealthCheck() {
            const checkBtn = document.getElementById('check-btn');
            checkBtn.disabled = true;
            checkBtn.textContent = '🔄 Checking...';
            
            log('🚀 Starting health check...', 'info');
            
            try {
                // Test endpoints
                const endpoints = [
                    ['Health Check', `${API_BASE}/health`],
                    ['API Health', `${API_BASE}/api/health`],
                    ['Main App', `${API_BASE}/`],
                    ['Demo Page', `${API_BASE}/demo.html`],
                    ['Standalone Demo', `${API_BASE}/standalone-demo`],
                    ['No Auth Demo', `${API_BASE}/no-auth-demo`]
                ];
                
                const results = await Promise.all(
                    endpoints.map(([name, url]) => testEndpoint(name, url))
                );
                
                // Test authentication
                log('🔐 Testing authentication...', 'info');
                const loginResult = await testEndpoint(
                    'Demo Login',
                    `${API_BASE}/api/auth/login`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: 'demo@example.com',
                            password: 'demo123'
                        })
                    }
                );
                
                let authResults = [loginResult];
                
                if (loginResult.success) {
                    try {
                        const loginData = await fetch(`${API_BASE}/api/auth/login`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                email: 'demo@example.com',
                                password: 'demo123'
                            })
                        }).then(r => r.json());
                        
                        const token = loginData.token;
                        
                        const verifyResult = await testEndpoint(
                            'Token Verification',
                            `${API_BASE}/api/auth/me`,
                            { headers: { 'Authorization': `Bearer ${token}` } }
                        );
                        
                        authResults.push(verifyResult);
                    } catch (e) {
                        log(`❌ Auth token test failed: ${e.message}`, 'error');
                    }
                }
                
                // Update UI
                updateEndpointStatus(results);
                updateAuthStatus(authResults);
                updateOverallStatus([...results, ...authResults]);
                
                log('📊 Health check completed', 'success');
                
            } catch (err) {
                log(`❌ Health check failed: ${err.message}`, 'error');
            } finally {
                checkBtn.disabled = false;
                checkBtn.textContent = '🔄 Run Check';
            }
        }

        function updateEndpointStatus(results) {
            const list = document.getElementById('endpoint-list');
            list.innerHTML = results.map(result => 
                `<div class="endpoint-item ${result.success ? 'online' : 'error'}">
                    <div class="endpoint-name">${result.name}</div>
                    <div class="endpoint-status">
                        <span>${result.status}</span>
                        <span>${result.duration}ms</span>
                        <div class="status-dot ${result.success ? '' : 'error'}"></div>
                    </div>
                </div>`
            ).join('');
        }

        function updateAuthStatus(results) {
            const list = document.getElementById('auth-status');
            list.innerHTML = results.map(result => 
                `<div class="endpoint-item ${result.success ? 'online' : 'error'}">
                    <div class="endpoint-name">${result.name}</div>
                    <div class="endpoint-status">
                        <span>${result.status}</span>
                        <span>${result.duration}ms</span>
                        <div class="status-dot ${result.success ? '' : 'error'}"></div>
                    </div>
                </div>`
            ).join('');
        }

        function updateOverallStatus(allResults) {
            const totalTests = allResults.length;
            const passedTests = allResults.filter(r => r.success).length;
            const successRate = Math.round((passedTests / totalTests) * 100);
            
            const avgResponseTime = Math.round(
                allResults.reduce((sum, r) => sum + (r.duration || 0), 0) / totalTests
            );
            
            document.getElementById('overall-status').textContent = `${successRate}%`;
            document.getElementById('overall-status').className = 
                successRate === 100 ? 'status-value status-online' :
                successRate >= 80 ? 'status-value status-warning' : 
                'status-value status-error';
            
            document.getElementById('response-time').textContent = `${avgResponseTime}ms`;
            document.getElementById('last-check').textContent = new Date().toLocaleTimeString();
        }

        function toggleAutoRefresh() {
            const toggle = document.getElementById('auto-refresh-toggle');
            
            if (toggle.checked) {
                log('🔄 Auto-refresh enabled (30s interval)', 'info');
                autoRefreshInterval = setInterval(runHealthCheck, 30000);
            } else {
                log('⏹️ Auto-refresh disabled', 'info');
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            log('🎯 Production monitor initialized', 'info');
            runHealthCheck();
        });
    </script>
</body>
</html>
